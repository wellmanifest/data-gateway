name: gateway
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: make upstream
      - run: make test
      - run: make docs-check BASE=${{ github.event.pull_request.base.sha || '' }}
